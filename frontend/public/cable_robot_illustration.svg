<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="pulleyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <radialGradient id="sensorLens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Environment -->
  <rect width="800" height="500" rx="24" fill="url(#skyGrad)" />
  
  <!-- Field Crop Rows in Background -->
  <g opacity="0.25">
    <path d="M 0 450 Q 400 420 800 450 L 800 500 L 0 500 Z" fill="#065f46" />
    <path d="M 0 470 Q 400 450 800 470 L 800 500 L 0 500 Z" fill="#047857" />
    <circle cx="120" cy="450" r="12" fill="#10b981" />
    <circle cx="280" cy="445" r="14" fill="#10b981" />
    <circle cx="440" cy="440" r="13" fill="#10b981" />
    <circle cx="600" cy="445" r="14" fill="#10b981" />
    <circle cx="720" cy="450" r="12" fill="#10b981" />
  </g>

  <!-- Left & Right Tower Supports -->
  <rect x="20" y="40" width="28" height="420" rx="6" fill="url(#metalGrad)" stroke="#334155" stroke-width="2" />
  <rect x="752" y="40" width="28" height="420" rx="6" fill="url(#metalGrad)" stroke="#334155" stroke-width="2" />
  <!-- Tower Cross Bracing -->
  <line x1="20" y1="90" x2="48" y2="150" stroke="#475569" stroke-width="3" />
  <line x1="48" y1="90" x2="20" y2="150" stroke="#475569" stroke-width="3" />
  <line x1="752" y1="90" x2="780" y2="150" stroke="#475569" stroke-width="3" />
  <line x1="780" y1="90" x2="752" y2="150" stroke="#475569" stroke-width="3" />

  <!-- Stepper Motor & Pulleys on Towers -->
  <!-- Left Motor Mount (NEMA 17 + A4988 Drive Unit) -->
  <rect x="42" y="85" width="46" height="52" rx="6" fill="#1e293b" stroke="#059669" stroke-width="2" />
  <rect x="46" y="90" width="38" height="18" rx="2" fill="#0f172a" />
  <circle cx="65" cy="118" r="12" fill="url(#pulleyGrad)" stroke="#0f172a" stroke-width="2" />
  <circle cx="65" cy="118" r="4" fill="#0f172a" />
  <text x="65" y="102" font-size="8" font-family="monospace" fill="#34d399" font-weight="bold" text-anchor="middle">ESP32</text>

  <!-- Right Motor Pulley Unit -->
  <rect x="712" y="85" width="46" height="52" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2" />
  <circle cx="735" cy="118" r="12" fill="url(#pulleyGrad)" stroke="#0f172a" stroke-width="2" />
  <circle cx="735" cy="118" r="4" fill="#0f172a" />

  <!-- Suspension Steel Cables (Tensioned Track Line) -->
  <line x1="65" y1="118" x2="350" y2="160" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <line x1="450" y1="160" x2="735" y2="118" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <line x1="65" y1="125" x2="350" y2="165" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" />
  <line x1="450" y1="165" x2="735" y2="125" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Center Robot Carriage (Trolley Platform) -->
  <g transform="translate(0, 0)">
    <!-- Trolley Pulley Wheel Assemblies on Cable -->
    <circle cx="360" cy="160" r="14" fill="url(#pulleyGrad)" stroke="#0f172a" stroke-width="3" />
    <circle cx="360" cy="160" r="5" fill="#047857" />
    <circle cx="440" cy="160" r="14" fill="url(#pulleyGrad)" stroke="#0f172a" stroke-width="3" />
    <circle cx="440" cy="160" r="5" fill="#047857" />
    <!-- Pulley Suspension Arms -->
    <path d="M 360 172 L 372 210 L 428 210 L 440 172 Z" fill="#334155" stroke="#1e293b" stroke-width="2" />

    <!-- Main Robot Chassis Body -->
    <rect x="330" y="210" width="140" height="100" rx="16" fill="url(#chassisGrad)" stroke="#34d399" stroke-width="3" filter="url(#glow)" />
    <!-- Inner Accent Panel -->
    <rect x="342" y="222" width="116" height="76" rx="10" fill="#0f172a" stroke="#047857" stroke-width="1.5" />

    <!-- Robot Label & Branding -->
    <text x="400" y="242" font-size="12" font-family="sans-serif" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">AGRIBOT CABLE-1</text>
    <text x="400" y="256" font-size="9" font-family="monospace" fill="#34d399" text-anchor="middle">PRECISION FIELD ROVER</text>

    <!-- Center AI Inspection Camera Module -->
    <circle cx="400" cy="274" r="13" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <circle cx="400" cy="274" r="8" fill="url(#sensorLens)" />
    <circle cx="398" cy="272" r="2.5" fill="#ffffff" opacity="0.8" />

    <!-- Sensor Pod / Downward Soil Probe Mount -->
    <rect x="382" y="310" width="36" height="30" rx="4" fill="#334155" stroke="#475569" stroke-width="2" />
    <line x1="392" y1="340" x2="392" y2="390" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="408" y1="340" x2="408" y2="390" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <!-- Probe Tips -->
    <polygon points="389,390 395,390 392,400" fill="#38bdf8" />
    <polygon points="405,390 411,390 408,400" fill="#10b981" />

    <!-- Navigation Direction Indicator Arrows (Subtle Overlay) -->
    <g opacity="0.6">
      <path d="M 280 255 L 305 240 L 305 270 Z" fill="#34d399" />
      <path d="M 520 255 L 495 240 L 495 270 Z" fill="#34d399" />
    </g>
  </g>

  <!-- Telemetry Overlay Badges in Graphic -->
  <g transform="translate(40, 420)">
    <rect width="180" height="34" rx="8" fill="#0f172a" opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <circle cx="18" cy="17" r="4" fill="#10b981" />
    <text x="32" y="21" font-size="11" font-family="monospace" fill="#e2e8f0" font-weight="bold">SPAN: 100M SUSPENSION</text>
  </g>

  <g transform="translate(580, 420)">
    <rect width="180" height="34" rx="8" fill="#0f172a" opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <circle cx="18" cy="17" r="4" fill="#38bdf8" />
    <text x="32" y="21" font-size="11" font-family="monospace" fill="#e2e8f0" font-weight="bold">ESP32 + A4988 NEMA17</text>
  </g>
</svg>
