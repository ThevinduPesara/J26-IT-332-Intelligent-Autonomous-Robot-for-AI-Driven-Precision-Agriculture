services:
  backend:
    build:
      context: .
    container_name: chilli-vision-backend
    ports:
      - "8000:8000"
    environment:
      PEST_MODEL_PATH: /app/models/best.pt
      PEST_IMAGE_SIZE: 640
      PEST_CONFIDENCE: 0.25
      PEST_CAMERA_INDEX: 0
      PEST_MAX_UPLOAD_MB: 15
    volumes:
      - ../training_results/YOLOv8n_Pest_Detection/weights:/app/models:ro
    restart: unless-stopped
